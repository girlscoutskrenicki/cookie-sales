services:
  - type: web
    name: cookie-forecast-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: backend/automation/cookie-drive-bot.json
      - key: DATABASE_URL
        value: <postgresql://cookie_admin:IjZUjKYNaK29BU9Z0GZGiauQKvQbueG7@dpg-d1s7k0buibrs73a3fglg-a.oregon-postgres.render.com/cookie_sales_db>

jobs:
  - type: cron
    name: run-cookie-sales-pipeline
    env: python
    schedule: "0 4 * * 1"  # every Monday at 4 AM UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/automation/run_pipeline.py
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: backend/automation/cookie-drive-bot.json
      - key: DATABASE_URL
        value: <postgresql://cookie_admin:IjZUjKYNaK29BU9Z0GZGiauQKvQbueG7@dpg-d1s7k0buibrs73a3fglg-a.oregon-postgres.render.com/cookie_sales_db>